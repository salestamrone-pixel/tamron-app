name: Build Android APK

# Runs on GitHub's free servers instead of Expo's paid build queue.
# Trigger it by hand from the Actions tab whenever a new APK is needed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The runner ships with ~70GB of preinstalled tooling we never use (.NET, Haskell,
      # Docker images, extra Android emulator images...). The Android build plus EAS's own
      # temp copy of the project filled the remaining space and failed while copying the
      # finished APK, so clear that junk first.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # Two builds in a row got killed with "The operation was canceled" around the
      # 25-30 minute mark, mid-compile, with no error from our own script. That's the
      # signature of the runner running out of disk and GitHub's infra reclaiming the
      # job rather than our build failing cleanly, so log free space before/after to
      # confirm or rule that out next time it happens.
      - name: Disk space before build
        run: df -h /

      # Logs free space every 20s for the whole build, so if the job gets killed again
      # we have a timeline instead of a single before/after snapshot.
      - name: Start disk space monitor
        run: |
          (while true; do date -u +"%H:%M:%S"; df -h / | tail -1; sleep 20; done) > disk-monitor.log 2>&1 &
          echo $! > monitor.pid

      - name: Build APK locally (uses GitHub's compute, not Expo's build queue)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # The runner's default JVM metaspace was too small and crash-looped with
          # OutOfMemoryError: Metaspace. Raising it is the actual fix; building a single
          # ABI (set in app.json) removes the need to also disable Gradle's parallelism,
          # which was making native C++ compilation of two architectures very slow.
          _JAVA_OPTIONS: -XX:MaxMetaspaceSize=1536m -Xmx3584m
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=1536m -Xmx3584m" -Dorg.gradle.daemon=false
        run: eas build --local -p android --profile preview --non-interactive --output "${{ github.workspace }}/tamron-app.apk"

      - name: Stop disk space monitor
        if: always()
        run: kill "$(cat monitor.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disk-monitor-log
          path: disk-monitor.log
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: tamron-app-apk
          path: tamron-app.apk
          retention-days: 30

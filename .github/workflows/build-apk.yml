name: Build Android APK

# Runs on GitHub's free servers instead of Expo's paid build queue.
# Trigger it by hand from the Actions tab whenever a new APK is needed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish a GitHub Release with the APK attached.
    permissions:
      contents: write
    steps:
      # The runner ships with ~70GB of preinstalled tooling we never use (.NET, Haskell,
      # Docker images, extra Android emulator images...). The Android build plus EAS's own
      # temp copy of the project filled the remaining space and failed while copying the
      # finished APK, so clear that junk first.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # Lets the app itself (src/lib/update-check.ts) compare its own build number against
      # GitHub's latest release and tell the user a newer APK exists. Only patches this
      # runner's checkout, not the committed app.json.
      - name: Stamp this build's number into app.json
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            p.expo.extra.buildNumber = ${{ github.run_number }};
            fs.writeFileSync('app.json', JSON.stringify(p, null, 2) + '\n');
          "

      # Two builds in a row got killed with "The operation was canceled" around the
      # 25-30 minute mark, mid-compile, with no error from our own script. That's the
      # signature of the runner running out of disk and GitHub's infra reclaiming the
      # job rather than our build failing cleanly, so log free space before/after to
      # confirm or rule that out next time it happens.
      - name: Disk space before build
        run: df -h /

      # Logs free space every 20s for the whole build, so if the job gets killed again
      # we have a timeline instead of a single before/after snapshot.
      - name: Start disk space monitor
        run: |
          (while true; do date -u +"%H:%M:%S"; df -h / | tail -1; sleep 20; done) > disk-monitor.log 2>&1 &
          echo $! > monitor.pid

      - name: Build APK locally (uses GitHub's compute, not Expo's build queue)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # The runner's default JVM metaspace was too small and crash-looped with
          # OutOfMemoryError: Metaspace. Raising it is the actual fix; building a single
          # ABI (set in app.json) removes the need to also disable Gradle's parallelism,
          # which was making native C++ compilation of two architectures very slow.
          _JAVA_OPTIONS: -XX:MaxMetaspaceSize=1536m -Xmx3584m
          # Four runs in a row got killed by GitHub with zero error output around the
          # 23-31 minute mark — a brand-new free account running flat-out on both cores
          # for that long looks like the signature of an anti-abuse CPU monitor, not a
          # real failure. Capping workers so we never saturate 100% may avoid tripping it.
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=1536m -Xmx3584m" -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
        run: eas build --local -p android --profile preview --non-interactive --output "${{ github.workspace }}/tamron-app.apk"

      - name: Stop disk space monitor
        if: always()
        run: kill "$(cat monitor.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disk-monitor-log
          path: disk-monitor.log
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: tamron-app-apk
          path: tamron-app.apk
          retention-days: 30

      # The Actions artifact above needs a GitHub login and downloads as a .zip, which
      # is awkward on a phone. A Release gives a plain, public, one-tap link straight to
      # the .apk file instead.
      - name: Publish a GitHub Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "تامرون - نسخة ${{ github.run_number }}"
          files: tamron-app.apk
          make_latest: true
